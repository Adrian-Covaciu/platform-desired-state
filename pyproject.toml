[project]
name = "platform-service"
version = "0.1.0"
description = "Personal project implementing a self-service platform for provisioning resources"
authors = [
    {name = "Adrian Covaciu"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic (>=2.14.3,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[virtualenvs]
in-project = true