[project]
name = "platform-service"
version = "0.1.0"
description = "Personal project implementing a self-service platform for provisioning resources"
authors = [
    {name = "Adrian Covaciu"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "pydantic (>=2.14.3,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "cdk8s (>=2.70.122,<3.0.0)",
    "constructs (>=10.8.1,<11.0.0)",
    "from-root (>=1.3.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false